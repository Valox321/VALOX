name: Rust CI

on:
  push:
  pull_request:

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release
      - name: Exercise UCI session (Windows)
        if: runner.os == 'Windows'
        run: pwsh -NoProfile -File tools/engine-match/verify-uci.ps1 -Engine target/release/valox.exe
      - name: Stress UCI session (Windows)
        if: runner.os == 'Windows'
        run: python tools/engine-match/stress-uci.py target/release/valox.exe --games 10
      - name: Stress UCI session (Linux)
        if: runner.os == 'Linux'
        run: python3 tools/engine-match/stress-uci.py target/release/valox --games 10

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo check --lib --target wasm32-unknown-unknown
