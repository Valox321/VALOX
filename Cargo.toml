[package]
name = "valox"
version = "0.5.0"
edition = "2021"
description = "Valox chess engine with UCI support"
license = "MIT OR Apache-2.0"

[features]
nnue-scalar = []

[profile.release]
codegen-units = 1

[lib]
name = "valox_engine"
crate-type = ["cdylib", "rlib"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pyrrhic-rs = "0.2.0"
